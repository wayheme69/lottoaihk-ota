name: Probe HKJC
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/hk_results.py
      - run: python3 scripts/hk_results.py --history 2002 2003 2004 2005 2006 2007 2008 2009 2010 2011 2012 2013 2014 2015 2016 2017 2018 2019 2020 2021 2022 2023 2024 2025 2026
      - run: |
          git config user.name "results-bot"; git config user.email "actions@github.com"
          git add hk_results.json history.json probe.json; git commit -m "probe" || true; git push
